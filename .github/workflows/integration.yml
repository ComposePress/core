name: WordPress integration

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, mysqli, pdo_mysql
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Start Docker WordPress stack
        run: docker compose -f docker-compose.integration.yml up -d --wait
      - name: Wait for WordPress
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/wp-login.php >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.integration.yml logs
          exit 1
      - name: Install WordPress test suite
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/scaffold-command/v2.0.0/templates/install-wp-tests.sh \
            -o /tmp/install-wp-tests.sh
          bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest
      - name: Run integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test:integration
      - name: Stop Docker WordPress stack
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
