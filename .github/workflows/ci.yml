name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: pcov
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:coverage
      - run: composer analyse
      - run: composer style

  scoped-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: composer install --no-interaction --prefer-dist
      - run: composer scope
      - run: composer scope:check
      - run: composer scope:compat
      - run: composer scope:check
